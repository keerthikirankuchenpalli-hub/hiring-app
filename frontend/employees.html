<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worqly Employees</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fd; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: #fff; border-radius: 10px; box-shadow: 0 8px 22px rgba(0,0,0,0.08); padding: 24px; }
    h1 { margin-top: 0; color: #293354; }
    nav a { margin-right: 14px; color: #4f46e5; text-decoration: none; }
    .message { margin: 12px 0; font-size: 14px; }
    .error { color: #c0392b; }
    .success { color: #27ae60; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .form-row input, .form-row select { padding: 8px 10px; flex: 1; border: 1px solid #cbd6e2; border-radius: 6px; }
    .form-row button { background: #4f46e5; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { border: 1px solid #e0e7ff; padding: 10px; text-align: left; }
    th { background: #eff2ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Employees</h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="index.html">Logout</a>
    </nav>

    <div class="message" id="status"></div>

    <section>
      <h2>Add Employee</h2>
      <div class="form-row">
        <input id="name" type="text" placeholder="Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <select id="role">
          <option value="Employee">Employee</option>
          <option value="Manager">Manager</option>
          <option value="HR">HR</option>
        </select>
        <input id="department" type="text" placeholder="Department" required>
        <button id="addBtn">Add</button>
      </div>
    </section>

    <h2>Employee List</h2>
    <div id="loading">Loading employees...</div>
    <table id="employeesTable" style="display:none;">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Created At</th></tr></thead>
      <tbody id="employeesBody"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const token = localStorage.getItem('worqly_token');
    if (!token) {
      window.location.href = 'index.html';
      throw new Error('No auth token');
    }

    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const tableEl = document.getElementById('employeesTable');
    const tbody = document.getElementById('employeesBody');

    const api = axios.create({
      baseURL: 'http://localhost:3005/api',
      headers: { Authorization: `Bearer ${token}` }
    });

    const fetchEmployees = async () => {
      loadingEl.style.display = 'block';
      tableEl.style.display = 'none';
      statusEl.textContent = '';

      try {
        const res = await api.get('/employees');
        const employees = res.data.employees || [];

        tbody.innerHTML = employees.map(emp => `
          <tr>
            <td>${emp.id}</td>
            <td>${emp.name}</td>
            <td>${emp.email}</td>
            <td>${emp.role}</td>
            <td>${emp.department}</td>
            <td>${new Date(emp.createdAt).toLocaleString()}</td>
          </tr>
        `).join('');

        if (employees.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6">No employees found.</td></tr>`;
        }

        tableEl.style.display = 'table';
      } catch (error) {
        statusEl.className = 'message error';
        statusEl.textContent = error.response?.data?.error || 'Failed to load employees.';
      } finally {
        loadingEl.style.display = 'none';
      }
    };

    document.getElementById('addBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const department = document.getElementById('department').value.trim();

      if (!name || !email || !role || !department) {
        statusEl.className = 'message error';
        statusEl.textContent = 'All fields are required.';
        return;
      }

      statusEl.className = 'message';
      statusEl.textContent = 'Creating employee...';

      try {
        await api.post('/employees', { name, email, role, department });
        statusEl.className = 'message success';
        statusEl.textContent = 'Employee added successfully.';
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('department').value = '';
        fetchEmployees();
      } catch (error) {
        statusEl.className = 'message error';
        statusEl.textContent = error.response?.data?.error || 'Error adding employee.';
      }
    });

    fetchEmployees();
  </script>
</body>
</html>
