<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worqly HR Login</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; }
    .card { width: 320px; padding: 24px; background: #ffffff; box-shadow: 0 6px 18px rgba(0,0,0,0.08); border-radius: 10px; }
    h1 { margin: 0 0 18px; font-size: 22px; color: #1f2a44; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #33475b; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd6e2; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 11px; background: #4f46e5; border: 0; color: #fff; font-size: 15px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4338ca; }
    .message { margin: 10px 0 0; font-size: 14px; color: red; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Worqly HR Login</h1>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role">
        <option value="Employee">Employee</option>
        <option value="Manager">Manager</option>
        <option value="HR">HR</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="password" />
    </div>
    <button id="loginBtn">Login</button>
    <div class="message" id="message"></div>
  </div>

  <script>
    const apiBase = 'http://localhost:3005/api';

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');

      messageEl.textContent = '';

      if (!email || !role || !password) {
        messageEl.textContent = 'Please fill all fields.';
        return;
      }

      try {
        const response = await fetch(`${apiBase}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          messageEl.textContent = data.error || 'Login failed';
          return;
        }

        localStorage.setItem('worqly_token', data.token);
        localStorage.setItem('worqly_user', JSON.stringify(data.user));

        window.location.href = 'dashboard.html';
      } catch (error) {
        messageEl.textContent = 'Network error, please try again.';
        console.error(error);
      }
    });
  </script>
</body>
</html>
